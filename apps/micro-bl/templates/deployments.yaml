{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "micro-bl.namespace" $ }}
  labels:
    app: {{ $name }}
    {{- include "micro-bl.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      annotations:
        # ConfigMap/Secret 变更后自动滚动，否则 env 不会热更新（改了配置却仍用旧值）
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
      labels:
        app: {{ $name }}
        {{- include "micro-bl.labels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ include "micro-bl.fullname" $ }}-app
      {{- with $.Values.images.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "micro-bl.image" (dict "root" $ "component" $name) }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          ports:
            - name: {{ $name }}-api
              containerPort: {{ $svc.httpPort }}
            - name: {{ $name }}-rpc
              containerPort: {{ $svc.grpcPort }}
          envFrom:
            - configMapRef:
                name: {{ include "micro-bl.configMapName" $ }}
            - secretRef:
                name: {{ include "micro-bl.secretRefName" $ }}
          env:
            - name: APP_DATABASE_DBNAME
              value: {{ $svc.dbName | quote }}
            - name: APP_SERVER_PORT
              value: {{ $svc.httpPort | quote }}
            - name: APP_SERVER_GRPC_PORT
              value: {{ $svc.grpcPort | quote }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ $name }}-api
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $name }}-api
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          volumeMounts:
            # 内部根 CA：App 用它验中间件服务端证书（单向 TLS）
            - name: internal-ca
              mountPath: /certs
              readOnly: true
      volumes:
        - name: internal-ca
          configMap:
            name: internal-ca
            items:
              - key: ca.crt
                path: internal-ca.crt
{{- end }}

# worker 拆成两个 Deployment（同一镜像，APP_WORKER_MODE 决定消费范围）：
#   worker-counters   三个计数消费组 + ZSet 重建 cron
#   worker-transcode  ffmpeg 转码（CPU 密集）
# 拆分后单 topic 打爆只扩对应组，负载画像（resources/lag 阈值）也各自独立。
{{- range $mode := list "counters" "transcode" }}
{{- $w := index $.Values.worker $mode }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-{{ $mode }}
  namespace: {{ include "micro-bl.namespace" $ }}
  labels:
    app: worker-{{ $mode }}
    {{- include "micro-bl.labels" $ | nindent 4 }}
spec:
  replicas: {{ $w.replicas }}
  selector:
    matchLabels:
      app: worker-{{ $mode }}
  template:
    metadata:
      annotations:
        # ConfigMap/Secret 变更后自动滚动，否则 env 不会热更新（改了配置却仍用旧值）
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
      labels:
        app: worker-{{ $mode }}
        {{- include "micro-bl.labels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ include "micro-bl.fullname" $ }}-app
      {{- with $.Values.images.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "micro-bl.image" (dict "root" $ "component" "worker") }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          # 健康端口：只给探针用，不承载业务也不被抓取（指标走 OTLP 推送）
          ports:
            - name: worker-health
              containerPort: 9091
          # liveness 只判心跳是否推进（worker 内部 /health 不查依赖）；
          # readiness 探 MySQL，写库不可用就从 Ready 摘掉
          readinessProbe:
            httpGet:
              path: /ready
              port: worker-health
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: worker-health
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: {{ include "micro-bl.configMapName" $ }}
            - secretRef:
                name: {{ include "micro-bl.secretRefName" $ }}
          env:
            - name: APP_DATABASE_DBNAME
              value: {{ $.Values.worker.dbName | quote }}
            - name: APP_DATABASE_AUTO_MIGRATE
              value: "false"
            # 消费范围开关：counters=三个计数 topic+cron，transcode=转码 topic
            - name: APP_WORKER_MODE
              value: {{ $mode | quote }}
            # ZSet 重建 cron 只放 counters（分布式锁在，但没必要两边各跑一份）
            - name: APP_RUN_CRON
              value: {{ eq $mode "counters" | quote }}
          resources:
            {{- toYaml $w.resources | nindent 12 }}
          volumeMounts:
            - name: internal-ca
              mountPath: /certs
              readOnly: true
      volumes:
        - name: internal-ca
          configMap:
            name: internal-ca
            items:
              - key: ca.crt
                path: internal-ca.crt
{{- end }}