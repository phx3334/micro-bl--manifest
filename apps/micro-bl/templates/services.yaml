{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ include "micro-bl.namespace" $ }}
  labels:
    app: {{ $name }}
    {{- include "micro-bl.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: {{ $name }}-api
      port: {{ $svc.httpPort }}
      targetPort: {{ $name }}-api
    - name: {{ $name }}-rpc
      port: {{ $svc.grpcPort }}
      targetPort: {{ $name }}-rpc
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ include "micro-bl.namespace" . }}
  labels:
    app: web
    {{- include "micro-bl.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: web-http
      port: {{ .Values.web.port }}
      targetPort: web-http
