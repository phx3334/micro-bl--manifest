# 镜像 tag 由 Tekton 的 update-gitops 回写为 commit SHA，
# pullPolicy 由同一任务设为 IfNotPresent；这里不再覆盖，避免可变标签 + Always 的组合。

services:
  user:
    replicas: 2
  video:
    replicas: 2
  interaction:
    replicas: 2

worker:
  replicas: 2

secret:
  # prod 凭据不随仓库分发：引用外部创建的 Secret（键名契约见 infra/credentials/README.md）
  # 创建方式：SealedSecret（推荐）或 CI/ansible 注入；缺失时 Pod 会停在 CreateContainerConfigError
  existingSecret: fake-tiktok-credentials

config:
  redis:
    sentinelAddrs: "redis.middleware:26379"
  minio:
    # 浏览器可达地址（Pod 内也走它）：prod 的 MinIO 同样开放 NodePort 30900
    # （见 infra/middleware/minio/values-prod.yaml），部署前把 REPLACE_WITH_SERVER_IP 换成第一台 master 公网 IP
    endpoint: "REPLACE_WITH_SERVER_IP:30900"
    publicRead: false
  otel:
    # 头采 30%（与 istio sidecar 头采对齐；base 同为 0.3）；尾采策略见 observability/otel-collector/base/config.yaml
    sampleRatio: "0.3"
    environment: prod
  app:
    skipCaptcha: false
    # 当前没有独立 migration Job：首次部署必须 true，否则空库上所有查询都会失败。
    # 表结构建好后改成 false 并重新同步，避免每次滚动更新都跑 DDL。
    autoMigrate: true

hpa:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
