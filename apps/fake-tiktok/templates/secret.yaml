{{- if not .Values.secret.existingSecret }}
{{- /* 裸装保护：任一凭据为空或仍是占位符时直接渲染失败，避免弱口令静默上线 */ -}}
{{- range $k, $v := .Values.secret.data }}
{{- $s := toString $v }}
{{- if or (eq $s "") (hasPrefix "CHANGE_ME" $s) (hasPrefix "REPLACE_" $s) }}
{{- fail (printf "secret.data.%s 为空或仍是占位符，拒绝渲染（必须在 values-prod 中提供真实值，或改用 existingSecret）" $k) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: '{{ include "fake-tiktok.secretName" . }}'
  namespace: '{{ include "fake-tiktok.namespace" . }}'
  labels:
    app.kubernetes.io/part-of: fake-tiktok
    app.kubernetes.io/managed-by: '{{ .Release.Service }}'
    helm.sh/chart: '{{ .Chart.Name }}-{{ .Chart.Version }}'
type: Opaque
stringData:
  APP_JWT_ACCESS_TOKEN_SECRET: '{{ .Values.secret.data.jwtAccessSecret }}'
  APP_JWT_REFRESH_TOKEN_SECRET: '{{ .Values.secret.data.jwtRefreshSecret }}'
  APP_DATABASE_PASSWORD: '{{ .Values.secret.data.databasePassword }}'
  APP_REDIS_PASSWORD: '{{ .Values.secret.data.redisPassword }}'
  APP_MINIO_ACCESS_KEY: '{{ .Values.secret.data.minioAccessKey }}'
  APP_MINIO_SECRET_KEY: '{{ .Values.secret.data.minioSecretKey }}'
{{- end }}