{{- /*
业务 Pod 的专用身份：只用于满足 Pod 的 serviceAccountName 要求，
不绑定任何 Role，且关闭 token 自动挂载——
业务代码不访问 K8s API，Pod 里出现 token 只会扩大泄漏面。
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fake-tiktok.fullname" . }}-app
  namespace: {{ include "fake-tiktok.namespace" . }}
  labels:
    {{- include "fake-tiktok.labels" . | nindent 4 }}
automountServiceAccountToken: false
