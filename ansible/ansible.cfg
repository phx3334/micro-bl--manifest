[defaults]
# inventory 由 terraform/inventory.tf 生成（含公网 IP，已被 .gitignore 排除）
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 30
deprecation_warnings = False

[privilege_escalation]
# 阿里云 Ubuntu 镜像默认 root 登录；保留 become 便于换普通用户镜像
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
