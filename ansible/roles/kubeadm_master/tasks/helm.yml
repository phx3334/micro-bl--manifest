# 只在第一个 master 上装 Helm（后续 kubectl/helm 都在这台执行）
---
- name: 检查 helm 是否已安装
  stat:
    path: /usr/local/bin/helm
  register: helm_binary

- name: 下载并安装 Helm
  when: not helm_binary.stat.exists
  block:
    - name: 下载 Helm 压缩包
      get_url:
        url: "{{ helm_download_url }}"
        dest: /tmp/helm.tar.gz
        mode: "0644"

    - name: 解压 Helm
      unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp
        remote_src: true

    - name: 安装 helm 到 /usr/local/bin
      copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        remote_src: true
        owner: root
        group: root
        mode: "0755"

- name: 校验 Helm 版本
  command: helm version --short
  changed_when: false
