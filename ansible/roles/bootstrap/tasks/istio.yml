# Istio 1.30.6：base（CRD）→ istiod（信任锚来自 cert-manager 的 cacerts）→ gateway
# 必须在 ArgoCD 之前装：platform-infra Application 会 apply Gateway/VirtualService 等 CR。
#
# 不走 helm repo：三份 chart tgz 从官方 storage 直接下到本地（带重试）。
---
- name: 下载 Istio chart 包
  get_url:
    url: "https://istio-release.storage.googleapis.com/charts/{{ item }}-{{ chart_versions.istio }}.tgz"
    dest: "{{ ansible_workdir }}/{{ item }}-{{ chart_versions.istio }}.tgz"
    mode: "0644"
    timeout: 180
  loop:
    - base
    - istiod
    - gateway
  register: istio_chart_download
  retries: 3
  delay: 5
  until: istio_chart_download is succeeded

- name: 复制 Istio values
  copy:
    src: "{{ infra_repo }}/infra/istio/{{ item }}"
    dest: "{{ ansible_workdir }}/{{ item }}"
    mode: "0644"
  loop:
    - values-base.yaml
    - values-istiod.yaml
    - values-istiod-prod.yaml
    - values-gateway.yaml
    - values-gateway-prod.yaml

- name: 安装 istio-base（CRD / 集群级 RBAC）
  command:
    argv:
    - helm
    - upgrade
    - --install
    - istio-base
    - "{{ ansible_workdir }}/base-{{ chart_versions.istio }}.tgz"
    - --namespace
    - istio-system
    - --create-namespace
    - --values
    - "{{ ansible_workdir }}/values-base.yaml"
    - --wait
    - --timeout
    - 5m

- name: 安装 istiod
  command:
    argv:
    - helm
    - upgrade
    - --install
    - istiod
    - "{{ ansible_workdir }}/istiod-{{ chart_versions.istio }}.tgz"
    - --namespace
    - istio-system
    - --values
    - "{{ ansible_workdir }}/values-istiod.yaml"
    - --values
    - "{{ ansible_workdir }}/values-istiod-prod.yaml"
    - --wait
    - --timeout
    - 10m

- name: 安装 ingressgateway（NodePort 30080）
  command:
    argv:
    - helm
    - upgrade
    - --install
    - istio-ingress
    - "{{ ansible_workdir }}/gateway-{{ chart_versions.istio }}.tgz"
    - --namespace
    - istio-system
    - --values
    - "{{ ansible_workdir }}/values-gateway.yaml"
    - --values
    - "{{ ansible_workdir }}/values-gateway-prod.yaml"
    - --wait
    - --timeout
    - 5m

- name: 等待 ingressgateway 就绪
  command: kubectl -n istio-system rollout status deployment/istio-ingress --timeout=300s
  changed_when: false
