# cert-manager + 全集群证书链：
# micro-bl-ca（根）→ harbor-tls / istio-ca / mysql-tls / redis-tls / kafka-tls / minio-tls
# 不走 helm repo：charts.jetstack.io 在国内 ECS 上被 reset，
# 改为下载 GitHub tag 源码包，用其中的本地 chart（含 crds/）安装。
---
# GitHub archive 解压目录会去掉 tag 的 v 前缀：v1.21.3 → cert-manager-1.21.3
- name: 计算 cert-manager 源码目录名
  set_fact:
    cert_manager_src_dir: "cert-manager-{{ chart_versions.cert_manager | regex_replace('^v', '') }}"

- name: 下载 cert-manager chart（GitHub archive）
  get_url:
    url: "https://github.com/cert-manager/cert-manager/archive/refs/tags/{{ chart_versions.cert_manager }}.tar.gz"
    dest: "{{ ansible_workdir }}/cert-manager-{{ chart_versions.cert_manager }}.tar.gz"
    mode: "0644"
    timeout: 180
  register: cert_manager_chart_download
  retries: 3
  delay: 5
  until: cert_manager_chart_download is succeeded

- name: 解压 cert-manager chart
  unarchive:
    src: "{{ ansible_workdir }}/cert-manager-{{ chart_versions.cert_manager }}.tar.gz"
    dest: "{{ ansible_workdir }}"
    remote_src: true
    creates: "{{ ansible_workdir }}/{{ cert_manager_src_dir }}/deploy/charts/cert-manager/Chart.yaml"

- name: 复制 cert-manager values
  copy:
    src: "{{ infra_repo }}/infra/cert-manager/{{ item }}"
    dest: "{{ ansible_workdir }}/{{ item }}"
    mode: "0644"
  loop:
    - values.yaml
    - values-prod.yaml

# 源码树没有 deploy/crds（CRD 在发布流程生成），用官方 release 的 CRD 清单
- name: 下载 cert-manager CRD 清单
  get_url:
    url: "https://github.com/cert-manager/cert-manager/releases/download/{{ chart_versions.cert_manager }}/cert-manager.crds.yaml"
    dest: "{{ ansible_workdir }}/cert-manager-crds.yaml"
    mode: "0644"
    timeout: 120
  register: cert_manager_crds_download
  retries: 3
  delay: 5
  until: cert_manager_crds_download is succeeded

- name: 安装 cert-manager CRD
  command: kubectl apply -f {{ ansible_workdir }}/cert-manager-crds.yaml
  changed_when: false

- name: 安装 cert-manager（含 CRD）
  command:
    argv:
    - helm
    - upgrade
    - --install
    - cert-manager
    - "{{ ansible_workdir }}/{{ cert_manager_src_dir }}/deploy/charts/cert-manager"
    - --namespace
    - cert-manager
    - --create-namespace
    # CRD 已由上面的 release 清单 apply，Helm 不再接管，避免 ownership 冲突
    - --skip-crds
    - --values
    - "{{ ansible_workdir }}/values.yaml"
    - --values
    - "{{ ansible_workdir }}/values-prod.yaml"
    - --wait
    - --timeout
    - 10m

- name: 等待 cert-manager webhook 就绪
  command: kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=300s
  changed_when: false

- name: 创建 cert-manager 清单目录
  file:
    path: "{{ ansible_workdir }}/cert-manager"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: 复制 cert-manager 自定义资源
  copy:
    src: "{{ infra_repo }}/infra/cert-manager/manifests"
    dest: "{{ ansible_workdir }}/cert-manager/"

- name: 应用根 CA / 业务证书 / 中间件证书
  command: kubectl apply -k {{ ansible_workdir }}/cert-manager/manifests
  register: cert_apply
  changed_when: "'created' in cert_apply.stdout or 'configured' in cert_apply.stdout"

- name: 等待根 CA 就绪
  command: kubectl -n cert-manager wait --for=condition=Ready certificate/micro-bl-ca --timeout=180s
  changed_when: false

- name: 等待 Istio 中间 CA 就绪
  command: kubectl -n istio-system wait --for=condition=Ready certificate/istio-ca --timeout=180s
  changed_when: false

- name: 等待 Harbor 证书就绪
  command: kubectl -n platform-system wait --for=condition=Ready certificate/harbor-tls --timeout=180s
  changed_when: false

# 分发器是每 30 分钟的 CronJob，首次部署手动触发一次，业务 Pod 才能挂到 internal-ca
- name: 清理上一次的分发 Job
  command: kubectl -n cert-manager delete job internal-ca-distribute-once --ignore-not-found
  changed_when: false

- name: 触发一次根 CA 分发
  command: kubectl -n cert-manager create job --from=cronjob/internal-ca-distributor internal-ca-distribute-once
  changed_when: true

- name: 等待分发完成
  command: kubectl -n cert-manager wait --for=condition=complete job/internal-ca-distribute-once --timeout=180s
  changed_when: false

# istiod 首启前必须已有 cacerts，否则会自签一套根 CA，和 Harbor/中间件形成两套信任锚。
# CronJob 是每 30 分钟一轮，这里手动触发一次，保证安装 Istio 前装配完成。
- name: 清理上一次的 istio cacerts 装配 Job
  command: kubectl -n istio-system delete job istio-cacerts-sync-once --ignore-not-found
  changed_when: false

- name: 触发一次 istio 中间 CA 装配
  command: kubectl -n istio-system create job --from=cronjob/istio-cacerts-sync istio-cacerts-sync-once
  changed_when: true

- name: 等待 istio cacerts 装配完成
  command: kubectl -n istio-system wait --for=condition=complete job/istio-cacerts-sync-once --timeout=180s
  changed_when: false
