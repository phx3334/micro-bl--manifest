# ArgoCD：引导层，自己不由 GitOps 管理。
# 安装后 apply AppProject + root Application，之后 infra/overlays/prod 与 apps/micro-bl
# 全部由它接管。
# 不走 helm repo（argoproj.github.io 国内时通时断）。
# 用 release 里打包好的 chart tgz：源码 archive 缺 charts/redis-ha 依赖，会报
# "found in Chart.yaml, but missing in charts/ directory: redis-ha"
---
- name: 下载 ArgoCD chart 包
  get_url:
    url: "https://github.com/argoproj/argo-helm/releases/download/argo-cd-{{ chart_versions.argo_cd }}/argo-cd-{{ chart_versions.argo_cd }}.tgz"
    dest: "{{ ansible_workdir }}/argo-cd-{{ chart_versions.argo_cd }}.tgz"
    mode: "0644"
    timeout: 180
  register: argo_chart_download
  retries: 3
  delay: 5
  until: argo_chart_download is succeeded

- name: 创建 ArgoCD 清单目录
  file:
    path: "{{ ansible_workdir }}/argocd"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: 复制 ArgoCD bootstrap 清单
  copy:
    src: "{{ infra_repo }}/cicd/argocd/bootstrap"
    dest: "{{ ansible_workdir }}/argocd/"

- name: 安装 ArgoCD
  command:
    argv:
    - helm
    - upgrade
    - --install
    - argocd
    - "{{ ansible_workdir }}/argo-cd-{{ chart_versions.argo_cd }}.tgz"
    - --namespace
    - argocd
    - --create-namespace
    - --values
    - "{{ ansible_workdir }}/argocd/bootstrap/argo-cd-values.yaml"
    - --values
    - "{{ ansible_workdir }}/argocd/bootstrap/argo-cd-values-prod.yaml"
    - --wait
    - --timeout
    - 10m

- name: 等待 argocd-server 就绪
  command: kubectl rollout status deployment -n argocd --timeout=300s
  changed_when: false

# AppProject 必须先于 root Application，否则子 Application 因项目不存在而报错
- name: 创建 AppProject
  command: kubectl apply -f {{ ansible_workdir }}/argocd/bootstrap/appproject.yaml

- name: 创建 root Application（prod）
  command: kubectl apply -f {{ ansible_workdir }}/argocd/bootstrap/root-application-prod.yaml