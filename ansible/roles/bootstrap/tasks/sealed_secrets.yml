# Sealed Secrets：prod 的 existingSecret 由 SealedSecret 解密得到。
# release 名必须是 sealed-secrets-controller（kubeseal 默认按这个名字找 Service）。
# 不走 helm repo：chart tgz 从 GitHub release 直接下到本地（带重试）。
---
- name: 下载 sealed-secrets chart 包
  get_url:
    url: "https://github.com/bitnami-labs/sealed-secrets/releases/download/helm-v{{ chart_versions.sealed_secrets }}/sealed-secrets-{{ chart_versions.sealed_secrets }}.tgz"
    dest: "{{ ansible_workdir }}/sealed-secrets-{{ chart_versions.sealed_secrets }}.tgz"
    mode: "0644"
    timeout: 120
  register: sealed_chart_download
  retries: 3
  delay: 5
  until: sealed_chart_download is succeeded

- name: 复制 sealed-secrets values
  copy:
    src: "{{ infra_repo }}/infra/sealed-secrets/values.yaml"
    dest: "{{ ansible_workdir }}/sealed-secrets-values.yaml"
    mode: "0644"

- name: 安装 sealed-secrets 控制器
  command:
    argv:
    - helm
    - upgrade
    - --install
    - sealed-secrets-controller
    - "{{ ansible_workdir }}/sealed-secrets-{{ chart_versions.sealed_secrets }}.tgz"
    - --namespace
    - kube-system
    - --values
    - "{{ ansible_workdir }}/sealed-secrets-values.yaml"
    - --wait
    - --timeout
    - 5m
