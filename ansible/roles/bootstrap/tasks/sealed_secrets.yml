# Sealed Secrets：prod 的 existingSecret 由 SealedSecret 解密得到。
# release 名必须是 sealed-secrets-controller（kubeseal 默认按这个名字找 Service）。
---
- name: 添加 sealed-secrets Helm 仓库
  command: helm repo add --force-update sealed-secrets {{ helm_repos.sealed_secrets }}
  changed_when: false

- name: 更新 sealed-secrets 仓库索引
  command: helm repo update sealed-secrets
  changed_when: false

- name: 复制 sealed-secrets values
  copy:
    src: "{{ infra_repo }}/infra/sealed-secrets/values.yaml"
    dest: "{{ ansible_workdir }}/sealed-secrets-values.yaml"
    mode: "0644"

- name: 安装 sealed-secrets 控制器
  command:
    - helm
    - upgrade
    - --install
    - sealed-secrets-controller
    - sealed-secrets/sealed-secrets
    - --namespace
    - kube-system
    - --version
    - "{{ chart_versions.sealed_secrets }}"
    - --values
    - "{{ ansible_workdir }}/sealed-secrets-values.yaml"
    - --wait
    - --timeout
    - 5m
