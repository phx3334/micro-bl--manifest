apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-fake-tiktok
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: fake-tiktok
  source:
    repoURL: https://github.com/phx3334/micro-bl--manifest.git
    targetRevision: main
    path: apps/fake-tiktok
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: fake-tiktok
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
