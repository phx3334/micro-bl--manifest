# prod：演示容量（镜像量小）
# 管理员密码与 secretKey 不入库：由 Secret harbor-credentials（platform-system）提供，
# 键名固定为 HARBOR_ADMIN_PASSWORD 与 secretKey（harbor chart 的 existingSecret 约定）。
# 创建命令见 README step 4；secretKey 必须恰好 16 字符。
persistence:
  persistentVolumeClaim:
    registry:
      size: 5Gi
    trivy:
      size: 1Gi

existingSecretAdminPassword: harbor-credentials
existingSecretSecretKey: harbor-credentials
