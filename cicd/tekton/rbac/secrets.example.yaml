# 示例文件：不会被 kustomize 应用，也不会进入集群。
# 真实凭据不要提交到仓库，部署时手工创建：
#
#   kubectl -n platform-system create secret generic github-webhook-secret \
#     --from-literal=secretToken="$(openssl rand -hex 32)"
#
#   kubectl -n platform-system create secret generic gitops-token \
#     --from-literal=token="<GitHub fine-grained PAT，仅 infra 仓 Contents: Read and write>"
#
#   kubectl -n platform-system create secret docker-registry harbor-push \
#     --docker-server="<master1-public-ip>:30003" \
#     --docker-username='robot$push' \
#     --docker-password='<Harbor robot token>'
#
# GitHub Webhook 的 Payload URL 填 http://<master1-public-ip>:30081，
# Content type 选 application/json，Secret 填上面生成的 secretToken。
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-secret
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: micro-bl
type: Opaque
stringData:
  secretToken: "REPLACE_WITH_RANDOM_32_CHARS"
---
apiVersion: v1
kind: Secret
metadata:
  name: gitops-token
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: micro-bl
type: Opaque
stringData:
  token: "REPLACE_WITH_GITHUB_PAT_FOR_INFRA_REPO"
---
apiVersion: v1
kind: Secret
metadata:
  name: harbor-push
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: micro-bl
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"REPLACE_WITH_SERVER_IP:30003":{"username":"robot$push","password":"REPLACE_WITH_HARBOR_ROBOT_TOKEN"}}}
