# EventListener 的 sink 需要以 tekton-triggers-sa 身份创建 PipelineRun。
# 只授 pipelineruns 的 create/get/list/watch：这是它唯一要做的事。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-triggers-create-pipelinerun
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: micro-bl
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list", "watch"]
  # TriggerTemplate 渲染时需要读取 Pipeline/Task 的元信息
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines", "tasks"]
    verbs: ["get", "list", "watch"]
  # GitHub interceptor 的 HMAC 校验需要 sink 读这个 Secret（只这一个，按名字限制）
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["github-webhook-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers-create-pipelinerun
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: micro-bl
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-triggers-create-pipelinerun
---
# EventListener sink 启动时要把 TriggerBinding / TriggerTemplate / EventListener
# 等都开 informer 缓存，只授 pipelineruns 是不够的（会 failed to start informers）。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-triggers-eventlistener
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: micro-bl
rules:
  - apiGroups: ["triggers.tekton.dev"]
    resources:
      - eventlisteners
      - triggerbindings
      - triggertemplates
      - triggers
      - interceptors
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers-eventlistener
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: micro-bl
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-triggers-eventlistener
---
# ClusterInterceptor / ClusterTriggerBinding 是集群级资源，必须 ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: micro-bl-tekton-triggers-cluster
  labels:
    app.kubernetes.io/part-of: micro-bl
rules:
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["clusterinterceptors", "clustertriggerbindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: micro-bl-tekton-triggers-cluster
  labels:
    app.kubernetes.io/part-of: micro-bl
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: micro-bl-tekton-triggers-cluster
