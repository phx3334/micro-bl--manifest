# 两个身份，职责分离：
#   tekton-triggers-sa —— EventListener sink 用，只需要"能创建 PipelineRun"；
#   tekton-build       —— TaskRun Pod 用，挂镜像推送/仓库回写的凭据。
# 不给 build 身份创建 PipelineRun 的权限，也不给 triggers 身份仓库凭据。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-sa
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: fake-tiktok
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-build
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: fake-tiktok
# 拉取 Harbor 镜像（业务镜像由 kubelet 拉，这里给 Task Pod 自身用）
imagePullSecrets:
  - name: harbor-push
# Task 步骤只用 git / buildctl / skopeo / trivy，没有任何一步调 K8s API：
# 不挂 token，任务被攻破也拿不到集群身份。
automountServiceAccountToken: false
