apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac/service-accounts.yaml
  - rbac/roles.yaml
  # Secret 不随 kustomize 下发：真实凭据由 kubectl/SealedSecret 创建，
  # 键名契约见 rbac/secrets.example.yaml。
  - tasks/git-clone.yaml
  - tasks/ci-checks.yaml
  - tasks/build-scan-push.yaml
  - tasks/update-gitops.yaml
  - pipelines/build-app.yaml
  - triggers/trigger-binding.yaml
  - triggers/trigger-template.yaml
  - triggers/event-listener.yaml
  - triggers/event-listener-service.yaml
