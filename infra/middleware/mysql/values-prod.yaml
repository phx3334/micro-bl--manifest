# 密码不入库：由 Secret mysql-credentials（middleware）提供，键名固定为
# mysql-password / mysql-root-password / mysql-replication-password
# （bitnami/mysql 的 auth.existingSecret 约定，三个键都必须存在）。
# 创建命令见 README step 4；mysql-password 必须与 apps/micro-bl 的
# micro-bl-credentials 里 APP_DATABASE_PASSWORD 同值，否则业务 Pod 全部连不上库。
auth:
  username: phx
  existingSecret: mysql-credentials

primary:
  persistence:
    # 只有 MySQL 使用动态 ESSD；其他组件保持 local-path
    # ESSD 最小容量通常 20Gi，所以这里直接申请 20Gi
    size: 20Gi
    storageClass: alicloud-disk-essd
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

# 业务已用非 root 账号 phx 连接并按库授权（见 init/01-databases.sql）；
# 真实生产应改为每库独立账号，并把凭据交给 external secret 管理。
