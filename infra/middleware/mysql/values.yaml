# bitnami/mysql —— 部署配置，对齐业务代码 server/configs/config.yaml：
#   连接：APP_DATABASE_HOST=mysql.middleware:3306，用户 phx
#   三库 feed_user / feed_video / feed_interaction 由 init/01-databases.sql 创建，
#   表结构由各服务启动时 AutoMigrate 创建（app values 的 config.app.autoMigrate）
#   账号：业务用 phx（auth.username/password），root 仅给运维与 exporter
#   密码一致性：auth.password 必须 == apps/fake-tiktok/values-* 的 secret.data.databasePassword

fullnameOverride: mysql

auth:
  # 业务账号：app 用 phx 连三个库（root 只留给运维与 mysqld_exporter）
  # 密码由 values-prod 覆盖；base 不填，禁止裸装
  username: phx
  password: ""
  # chart 据此建库并给 phx 授权；另外两库的授权见 init/01-databases.sql
  database: feed_user
  rootPassword: ""

primary:
  initdb:
    # 首次安装前先建 ConfigMap（见 README），否则三库不会创建
    scriptsConfigMap: mysql-initdb
  persistence:
    enabled: true
    size: 20Gi

# 指标：metrics.enabled → mysqld_exporter sidecar（9104）+ ServiceMonitor
#   （Prometheus 已关 selectorNilUsesHelmValues，不需要 release 标签也能被发现）
#   mysqld_exporter 需连库查 performance_schema：报 access denied 时按 README 补权限
metrics:
  enabled: true
  serviceMonitor:
    enabled: true

# ── 单向 TLS：只给服务端配证书，客户端不出示证书 ─────────────────
# 证书由 cert-manager 签发（infra/cert-manager/manifests/middleware-certificates.yaml），
# Secret mysql-tls 里是 tls.crt / tls.key / ca.crt，与本 chart 的默认键名一致。
# 刻意不设 require_secure_transport：一开就会连 mysqld_exporter 和排障用的明文客户端
# 一起拒掉；业务侧通过 APP_DATABASE_TLS_ENABLED=true 主动启用 TLS。
tls:
  enabled: true
  autoGenerated: false
  certificatesSecret: mysql-tls
  certFilename: tls.crt
  certKeyFilename: tls.key
  caFilename: ca.crt
