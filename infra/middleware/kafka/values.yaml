
fullnameOverride: kafka
kraft:
  enabled: true                    # 单节点 KRaft，无 ZooKeeper
controller:
  replicaCount: 1
listeners:
  client:
    # 单向 TLS：只加密 client ↔ broker，broker 之间与 controller 保持明文
    # （单节点 KRaft，内部没必要再套一层）。
    protocol: SSL
    # 不设 advertisedHost：chart 32.x 没有这个键（写了也是被忽略的死配置），
    # 默认 advertised 是 kafka-N.kafka-headless.middleware.svc.cluster.local:9092，
    # 自带命名空间，跨命名空间客户端可以直接解析。
autoCreateTopicsEnable: true
persistence:
  enabled: true
  size: 20Gi

# ── 单向 TLS：交给 chart 原生 PEM 支持 ────────────────────────
# chart 32.x 的 init 容器会读取 existingSecret，把 tls.crt / tls.key / ca.crt
# 复制到 /opt/bitnami/kafka/config/certs，key 转 PKCS#8 后统一打成 JKS
#（server.properties 里 chart 固定写 ssl.keystore.type: JKS）。
# 所以不要再自己挂载 /opt/bitnami/kafka/config/certs（mountPath 重复会被 API 拒绝），
# 也不要在 extraConfig 里覆盖 ssl.keystore.*（会和 chart 生成的 JKS 配置打架）。
tls:
  # chart 32.x：type 默认 JKS，PEM 必须显式声明；existingSecret 提供
  # tls.crt / tls.key / ca.crt（cert-manager 产出的 kafka-tls）
  type: PEM
  existingSecret: kafka-tls
  autoGenerated:
    enabled: false
  # chart 默认是 required = mTLS（客户端必须出示证书）；
  # 业务侧只做单向 TLS（只验 broker 证书），这里必须显式降成 none，
  # 否则 producer/consumer 全部 SSL handshake 失败。
  sslClientAuth: none
extraConfig: |
  # 短时演示：日志只留 24h，避免小数据盘被写满
  log.retention.hours=24
  # 自动建 topic 的默认分区数：KEDA Kafka scaler 的副本上限 = topic 分区数，
  # 默认 1 会让 worker 扩容被永久卡在 1 副本。必须 >= worker 的 maxReplicaCount
  # （base 4 / prod 6，见 apps/micro-bl/values*.yaml）。已建 topic 不受此参数影响，
  num.partitions=6

# JMX 指标：开关打开即由 chart 生成全部配套资源——
#   exporter 以 sidecar 容器（jmx-exporter）注入 kafka StatefulSet pod，不是独立 Deployment；
#   同时生成 jmx-configmap + Service(kafka-jmx-metrics) + ServiceMonitor。
#   生成的 ServiceMonitor 不带 release 标签——靠 prometheus 那三行 nilUsesHelmValues=false 被发现
metrics:
  jmx:
    enabled: true
    # bitnami/jmx-exporter 已 403，legacy 快照保留原 tag
    image:
      registry: docker.io
      repository: bitnamilegacy/jmx-exporter
      tag: 1.4.0-debian-12-r0
  serviceMonitor:
    enabled: true
