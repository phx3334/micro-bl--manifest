
fullnameOverride: kafka
kraft:
  enabled: true                    # 单节点 KRaft，无 ZooKeeper
controller:
  replicaCount: 1
listeners:
  client:
    # 单向 TLS：只加密 client ↔ broker，broker 之间与 controller 保持明文
    # （单节点 KRaft，内部没必要再套一层）。
    protocol: SSL
    # 跨命名空间客户端（micro-bl / observability）必须拿到 FQDN；
    # 否则 chart 默认 advertised 短名 kafka:9092 在别的命名空间解析不到。
    # 该键名随 chart 版本可能变化，安装前用 helm template 核对。
    advertisedHost: kafka.middleware.svc.cluster.local
    advertisedPort: 9092
autoCreateTopicsEnable: true
persistence:
  enabled: true
  size: 20Gi

# ── 单向 TLS 材料：PEM 直接挂载 ────────────────────────────────
# bitnami kafka chart 传统用 JKS keystore，cert-manager 产出的是 PEM。
# Kafka 2.7+ 原生支持 PEM，这里用 extraVolumes + extraConfig 提供，
# 并把 chart 自带的 JKS 自动生成关掉（否则两套配置会互相覆盖）。
# ⚠️ 键名/路径随 chart 版本可能变化，安装前先 `helm template` 看一眼渲染结果。
tls:
  autoGenerated: false
extraVolumes:
  - name: kafka-tls
    secret:
      secretName: kafka-tls
extraVolumeMounts:
  - name: kafka-tls
    mountPath: /opt/bitnami/kafka/config/certs
    readOnly: true
extraConfig: |
  ssl.keystore.type=PEM
  ssl.keystore.certificate.chain=/opt/bitnami/kafka/config/certs/tls.crt
  ssl.keystore.key=/opt/bitnami/kafka/config/certs/tls.key
  ssl.truststore.type=PEM
  ssl.truststore.certificates=/opt/bitnami/kafka/config/certs/ca.crt
  # 短时演示：日志只留 24h，避免小数据盘被写满
  log.retention.hours=24

# JMX 指标：开关打开即由 chart 生成全部配套资源——
#   exporter 以 sidecar 容器（jmx-exporter）注入 kafka StatefulSet pod，不是独立 Deployment；
#   同时生成 jmx-configmap + Service(kafka-jmx-metrics) + ServiceMonitor。
#   生成的 ServiceMonitor 不带 release 标签——靠 prometheus 那三行 nilUsesHelmValues=false 被发现
metrics:
  jmx:
    enabled: true
  serviceMonitor:
    enabled: true
