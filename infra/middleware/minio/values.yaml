
fullnameOverride: minio

# 明确不注入 istio sidecar。middleware 命名空间已整体 istio-injection: disabled
# （见 infra/base/namespaces.yaml），这里的 podAnnotations 是冗余但无害的双保险：
#   万一将来有人给 middleware 重新开注入，MinIO 必须仍然排除在外——
#   9000 端口同时是「浏览器消费的媒体 API」和「Prometheus 指标端点」，
#   注入后 STRICT mTLS 会拦掉网格外的 Prometheus 和 Tempo；
#   若给 9000 开 PERMISSIVE，等于业务端口也降级 —— 不如整体不进网格。
#   网格外的 Prometheus / Tempo / 浏览器连 MinIO 走应用层单向 TLS（tls 段）。
podAnnotations:
  sidecar.istio.io/inject: "false"

auth:
  # base 不填密码，禁止裸装；由 values-prod 覆盖
  rootUser: phx
  rootPassword: ""
  # 外部 Secret 的键名是 rootUser / rootPassword（见 infra/credentials/README.md），
  # 而 chart 默认找 root-user / root-password —— 不显式对齐的话，
  # 容器会报 "/opt/bitnami/minio/secrets/root-user is not readable"，
  # MinIO 拿不到 root 凭据直接退出（CrashLoopBackOff）。
  # 另：MinIO 强制 rootPassword ≥ 8 字符（147258 只有 6 位，会被直接拒绝启动）。
  rootUserSecretKey: rootUser
  rootPasswordSecretKey: rootPassword

defaultBuckets: micro-bl

# chart 17.x 仍自带 Console（bitnami/minio-object-browser，已 403）。
# 演示不需要管理界面：mc 客户端足够，关掉可省一个 Deployment 和一个 NodePort。
console:
  enabled: false

persistence:
  enabled: true
  size: 50Gi

# 指标：MinIO 服务端自带 /minio/v2/metrics/cluster，与 API 共用 9000 端口，
# 不需要额外 exporter。chart 17 的 metrics.prometheusAuthType 默认就是 public
#（免鉴权供 Prometheus 抓取，ServiceMonitor 见
# observability/prometheus/manifests/servicemonitor-minio.yaml），
# 不要再通过 extraEnvVars 重复注入 MINIO_PROMETHEUS_AUTH_TYPE（会报 env 覆盖告警）。
# 收紧方案（对外暴露的环境）：改 cfg + `mc admin prometheus generate` 生成 token
# 挂成 Secret，ServiceMonitor 的 endpoint 配 authorization.bearerFromSecret。

# ── 单向 TLS：服务端证书由 cert-manager 签发 ───────────────────
# Secret minio-tls 里是 tls.crt / tls.key / ca.crt；
# bitnami chart 会把 certFilename/certKeyFilename 两个键映射成容器里的
# public.crt / private.key（MinIO 只认这两个固定文件名）。
# 部署前确认 chart 版本是否仍是这套映射，否则用 items 手动重命名。
#
# 连带影响（漏一个就连不上）：
#   · 业务：APP_MINIO_USE_SSL=true，endpoint 的 host 必须在证书 SAN 里
#     （使用节点 IP:30900，所以证书必须带该 IP）
#   · Tempo：S3 endpoint 改 https + 挂同一个内部根 CA
#   · Prometheus：ServiceMonitor 的 scheme 改 https + tlsConfig.ca
#   · 浏览器：直链变 https，需要信任内部根 CA（或只在受控环境访问）
tls:
  enabled: true
  autoGenerated:
    enabled: false
  # 这个旧键 chart 只在 validateValues 里检查（缺了直接 fail），
  # 实际挂载走下面的 existingCASecret / server.existingSecret
  existingSecret: minio-tls
  # chart 会把 CA Secret 的 tls.crt 投影成 /certs/CAs/public.crt，
  # 这个目录同时被 mc 当作信任锚（setup.sh 会复制到 client conf 的 certs/CAs）。
  # 因此 CA 必须单独一个 Secret，里面放的是根 CA 证书而不是叶子证书：
  #   kubectl -n middleware get secret minio-tls -o jsonpath='{.data.ca\.crt}' ...
  # 若这里指向叶子 Secret（minio-tls），mc 会因信任锚不对而连不上 localhost，
  # 报 "Failed to add temporary MinIO server" 后容器退出。
  existingCASecret: minio-ca
  server:
    existingSecret: minio-tls