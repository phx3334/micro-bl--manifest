# bitnami/redis —— 部署配置，对齐业务代码 server/configs/config.yaml：
#   连接：APP_REDIS_HOST=redis.middleware，哨兵地址 redis.middleware:26379，
#   key 前缀 feedsystem:v1 是业务侧配置，与 Redis 无关
#   密码一致性：auth.password 必须与 apps/fake-tiktok 的 Secret 同值
#
# 高可用：Sentinel 1 主 2 从（3 个数据节点，sentinel 与 redis 同 Pod）。
#   sentinel.enabled 会关闭 master/replicas 两个 Service，改为单一 Service
#   （名为 redis）同时暴露数据端口 6379 与哨兵端口 26379。

fullnameOverride: redis             # Service 固定 redis.middleware（证书 SAN 依赖）

architecture: replication            # demo 高可用；单机改回 standalone

sentinel:
  enabled: true
  masterSet: mymaster
  quorum: 2                         # 3 个哨兵，2 票过半

replica:
  replicaCount: 2                   # 1 主 + 2 从，保证哨兵 quorum
  # 强制 3 个数据节点分散到不同工作节点：否则挂一台可能同时丢 2 个哨兵，quorum 失效
  podAntiAffinityPreset: hard
  persistence:
    size: 10Gi

auth:
  # base 不填，禁止裸装；由 values-prod 覆盖
  password: ""
  sentinel: true                    # 哨兵也要求密码，客户端需 SentinelPassword

master:
  # 业务依赖持久化：验证码短命可丢，但点赞判重/热度 ZSet 丢了会算错
  configuration: |
    appendonly yes
  persistence:
    enabled: true
    size: 10Gi

# 指标：metrics.enabled → redis_exporter sidecar（9121）+ ServiceMonitor
# 开 TLS 后 exporter 必须走 rediss:// 并信任内部根 CA，
# 否则 9104/9121 这类抓取会全红（业务正常、只丢指标）。
# 键名 metrics.extraEnvVars / extraVolumes 随 chart 版本可能不同，安装前核对。
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
  extraEnvVars:
    - name: REDIS_ADDR
      value: rediss://127.0.0.1:6379
    # Go 的 crypto/x509 会读这个变量作为系统根证书
    - name: SSL_CERT_FILE
      value: /certs/internal-ca.crt
  extraVolumes:
    - name: internal-ca
      configMap:
        name: internal-ca
        items:
          - key: ca.crt
            path: internal-ca.crt
  extraVolumeMounts:
    - name: internal-ca
      mountPath: /certs
      readOnly: true

# ── 单向 TLS ──────────────────────────────────────────────────
# 证书由 cert-manager 签发（middleware-certificates.yaml），Secret redis-tls。
# 注意两点：
#   1) authClients: false —— 单向 TLS，不要求客户端证书；默认 true 会退化成 mTLS，
#      业务侧没有配客户端证书，连不上；
#   2) 开启后 6379 只接受 TLS，redis_exporter 必须一起改：
#      REDIS_ADDR=rediss://127.0.0.1:6379，并把 internal-ca 挂进 exporter 容器
#      （metrics.extraEnvVars / extraVolumeMounts，按 chart 版本核对键名）。
tls:
  enabled: true
  autoGenerated: false
  existingSecret: redis-tls
  certFilename: tls.crt
  certKeyFilename: tls.key
  certCAFilename: ca.crt
  authClients: false
