apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    purpose: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: middleware
  labels:
    purpose: middleware
    istio-injection: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    purpose: observability
    # 刻意不注入 sidecar：Prometheus 要在网格外抓取（注入后对 K8s API 的访问
    # 需要额外 exclude，抓取链路多一跳，收益低）；Tempo/Loki/Grafana 同理。
    istio-injection: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: micro-bl
  labels:
    purpose: application
    # 业务三服务 + worker + web 全部注入：服务间 gRPC 调用、到中间件的访问都自动 mTLS
    istio-injection: enabled