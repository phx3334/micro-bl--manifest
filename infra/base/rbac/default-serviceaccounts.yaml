# 默认 ServiceAccount 收紧：关闭 token 自动挂载。
#
# 为什么改 default 而不是逐个 Pod：这四类命名空间里还有大量 chart 生成的 Pod
# （mysql / redis / kafka / minio / harbor / prometheus …），它们都不访问 K8s API，
# 但 Helm chart 很少暴露 automountServiceAccountToken 这个字段。
# 改命名空间的 default SA，等于给"没有显式指定 SA"的 Pod 统一摘掉 token；
# 真正需要 API 的组件（istiod / Prometheus / Tekton / 本项目的两个同步 CronJob）
# 都用自己的 SA，不受影响。
#
# 代价：以后谁在在这些命名空间里写新工作负载、又需要访问 API，必须显式建 SA 并绑定最小权限，
# 不会再"默认就有 token 可用"——这正是想要的效果。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: micro-bl
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: middleware
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: platform-system
automountServiceAccountToken: false
