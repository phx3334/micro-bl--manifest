# 南北向入口网关：外部流量经 istio-ingressgateway 进入网格（Sidecar 模式）
#
# 必须放在 istio-system：Gateway 由 istiod 在配置命名空间（PILOT_CONFIG_NAMESPACE，默认 istio-system）里查找，
# 放到业务命名空间会被直接忽略。
#
# base 用通配 host，具体 IP 由 overlays/prod 用 patch 覆盖，避免 base 里出现环境相关字段。
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: micro-bl-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    # HTTP 80：直连 IP 的 demo 入口（http://<EIP>:30080 → NodePort 30080）
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
    # HTTPS 443：域名入口（CDN 回源 / 直连域名）。TLS 在这里终结，
    # 证书 = *.temporary-demo.xyz（cert-manager DNS-01 签发，Secret 见 wildcard-certificate.yaml）。
    # 公网 SLB 443 透传到 NodePort 30443（见 terraform/slb.tf 与 istio/values-gateway.yaml）。
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        # Secret 与 Gateway 同命名空间（istio-system），由 cert-manager 自动签发/续期
        credentialName: temporary-demo-tls
      hosts:
        - "temporary-demo.xyz"
        - "*.temporary-demo.xyz"
