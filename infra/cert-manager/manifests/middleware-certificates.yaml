# 中间件单向 TLS 证书：只签「服务端」证书，客户端不出示证书。
#
# 依赖：middleware 命名空间已由 infra/base/namespaces.yaml 创建。
# 四张证书都由全集群唯一的根 CA（fake-tiktok-ca-issuer）签发，
# 客户端只需信任同一个 ca.crt。
#
# SAN 不是随便写：TLS 校验比的是「客户端连接时用的 host」。
#   · 业务 Pod 在 fake-tiktok，跨命名空间只能用 <svc>.middleware
#   · exporter sidecar 走 127.0.0.1 → 必须有 IP SAN
#   · MinIO 的直链给浏览器用节点 IP（NodePort）→ 必须有该 IP 的 SAN
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mysql-tls
  namespace: middleware
  labels:
    app.kubernetes.io/part-of: fake-tiktok
spec:
  secretName: mysql-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
    - key encipherment
  dnsNames:
    - mysql
    - mysql.middleware
    - mysql.middleware.svc
    - mysql.middleware.svc.cluster.local
  ipAddresses:
    - 127.0.0.1   # mysqld_exporter sidecar 连 localhost
  issuerRef:
    name: fake-tiktok-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redis-tls
  namespace: middleware
  labels:
    app.kubernetes.io/part-of: fake-tiktok
spec:
  secretName: redis-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
    - key encipherment
  dnsNames:
    - redis
    - redis.middleware
    - redis.middleware.svc
    - redis.middleware.svc.cluster.local
    - redis-master
    - redis-master.middleware
    - redis-master.middleware.svc
    - redis-master.middleware.svc.cluster.local
    # Sentinel 模式：headless Service 与 3 个数据节点（哨兵/主从互联按这些名字验签）
    - redis-headless
    - redis-headless.middleware
    - redis-headless.middleware.svc
    - redis-headless.middleware.svc.cluster.local
    - redis-node-0.redis-headless.middleware.svc.cluster.local
    - redis-node-1.redis-headless.middleware.svc.cluster.local
    - redis-node-2.redis-headless.middleware.svc.cluster.local
  ipAddresses:
    - 127.0.0.1   # redis_exporter sidecar 连 localhost
  issuerRef:
    name: fake-tiktok-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-tls
  namespace: middleware
  labels:
    app.kubernetes.io/part-of: fake-tiktok
spec:
  secretName: kafka-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
    - key encipherment
  dnsNames:
    - kafka
    - kafka.middleware
    - kafka.middleware.svc
    - kafka.middleware.svc.cluster.local
    - kafka-headless.middleware.svc.cluster.local
    - kafka-0.kafka-headless.middleware.svc.cluster.local
    - kafka-controller-0.kafka-controller-headless.middleware.svc.cluster.local
  issuerRef:
    name: fake-tiktok-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# MinIO：Secret 名直接用 chart 要的 minio-tls；
# bitnami chart 会把 tls.certFilename/tls.certKeyFilename 映射成 public.crt/private.key，
# 所以这里保持 cert-manager 的三件套键名即可。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: minio-tls
  namespace: middleware
  labels:
    app.kubernetes.io/part-of: fake-tiktok
spec:
  secretName: minio-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
    - key encipherment
  dnsNames:
    - minio
    - minio.middleware
    - minio.middleware.svc
    - minio.middleware.svc.cluster.local
  ipAddresses:
    # ⚠️ 与 harbor-tls 同一个占位符：浏览器直链和 Pod 都走 NodePort IP
    - REPLACE_WITH_SERVER_IP
  issuerRef:
    name: fake-tiktok-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
