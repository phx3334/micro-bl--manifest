# 与 Gateway 的 hosts 保持一致，否则 VirtualService 绑不到 Gateway：
# IP 对应 HTTP 80 直连入口，域名对应 HTTPS 443（CDN 回源 / 直连域名）。
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: micro-bl
  namespace: micro-bl
spec:
  hosts:
    - REPLACE_WITH_SERVER_IP
    - temporary-demo.xyz
    - "*.temporary-demo.xyz"
