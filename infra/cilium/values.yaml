
ipam:
  mode: kubernetes


# eBPF 完全替代 kube-proxy：ClusterIP / NodePort / LoadBalancer 转发全由 Cilium 处理，
# 省掉 kube-proxy 的 iptables 规则（大集群下规则数万条，性能与同步延迟都是问题）。
# 配套要求（已落实）：kubeadm init 跳过 addon/kube-proxy，集群里根本不装 kube-proxy
# （见 ansible roles/kubeadm_master tasks/main.yml）；两者同时运行会抢 Service 转发。
# 回滚：helm upgrade 把此值改回 false，并去掉 kubeadm 的 --skip-phases 后重建集群。
kubeProxyReplacement: true

# kube-proxy 被跳过，Cilium 起来前 Service IP（10.96.0.1）不可用。
# 必须显式给 apiserver 地址，否则 config 容器连 10.96.0.1 会超时：
#   dial tcp 10.96.0.1:443: i/o timeout → Init:Error → helm --wait 超时。
# 地址与 kubeadm controlPlaneEndpoint 保持一致（当前为统一入口 EIP）。
k8sServiceHost: "121.196.109.9"
k8sServicePort: "6443"


rollOutCiliumPods: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    service:

      type: NodePort
      nodePort: 30400

resources:
  requests:
    cpu: 100m
    memory: 256Mi

operator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi