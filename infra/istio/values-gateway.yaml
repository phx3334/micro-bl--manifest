labels:
  istio: ingressgateway

service:
  # 浏览器直连：单机/无 LB 的云集群里 LoadBalancer 会一直 pending，
  # 用 NodePort 最省事（云服务器安全组要放行）
  type: NodePort
  # 注意：这里覆盖 ports 是整体替换（helm 列表不合并），会丢掉默认的
  # status-port(15021)。demo 不抓网关自身状态端口，影响可接受。
  # https(443→8443) 必须带上：Gateway 的 443 SIMPLE TLS 在此终结
  # （证书由 cert-manager 签发，见 infra/cert-manager/manifests/wildcard-certificate.yaml），
  # 公网 SLB 443 透传到下面固定的 NodePort 30443（见 terraform/slb.tf）。
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
      # 固定端口而不是让 K8s 随机分配
      nodePort: 30080
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
      nodePort: 30443

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi