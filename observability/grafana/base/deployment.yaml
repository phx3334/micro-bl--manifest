# Grafana：Deployment + Service + 数据 PVC
#
# 全部内容都是 IaC：
#   base/datasources.yaml        → 三个数据源（Prometheus / Tempo / Loki），启动即生效
#   base/dashboards.yaml         → 看板加载器，扫描 /var/lib/grafana/dashboards
#   base/dashboards/*.json       → 看板本体，ConfigMap 挂载
# 只有 admin 密码来自 Secret（overlays/*/secret.yaml），不进仓库明文。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
    app.kubernetes.io/name: grafana
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate          # 单副本 + RWO：滚动更新会抢同一块盘
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      # 数据源/看板全部来自 ConfigMap，不访问 K8s API → 不挂载 SA token
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 472      # Grafana 镜像内固定 uid
        runAsGroup: 472
        fsGroup: 472        # 让 PVC 对 472 可写
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: phx
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: adminPassword
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # 关掉匿名访问与版本检查（内网实验）
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
            # 注意顺序：dashboards 必须挂在 data 之后声明也可，但路径更具体者优先
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
