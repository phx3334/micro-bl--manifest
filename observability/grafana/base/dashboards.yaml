# 看板加载器：Grafana 每 30s 扫描 /var/lib/grafana/dashboards，自动加载/更新 JSON
#
# 看板 JSON 和这个文件一样，全部在仓库里（base/dashboards/），删掉即下线。
apiVersion: 1

providers:
  - name: micro-bl
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true        # 允许在 UI 里试改，改好再导出 JSON 覆盖仓库
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
