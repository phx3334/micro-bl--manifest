# 数据源 provisioning：Grafana 启动时自动创建，不依赖 UI 手工点
#
# 三个数据源的 uid 固定（prometheus / tempo / loki），看板与互跳配置都靠 uid 引用。
# 服务都在 observability 命名空间，用短名即可。
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus-kube-prometheus-prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s          # 与 ServiceMonitor 的抓取间隔一致

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Trace → 日志：按 trace_id 跳到 Loki
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
      # Trace → 指标：从 span 跳到同一服务的指标
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # 日志正文里的 trace_id → 一键跳到 Tempo（$$ 是 Grafana 的环境变量转义）
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          name: TraceID
          url: "$${__value.raw}"
