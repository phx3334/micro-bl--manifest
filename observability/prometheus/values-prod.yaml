# prod：短时演示（6h 保留、5G 盘）；Prometheus / Alertmanager 保持 ClusterIP
prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 6h
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 5Gi
