
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-sidecars
  namespace: observability
  labels:
    app.kubernetes.io/part-of: fake-tiktok
spec:
  namespaceSelector:
    matchNames:
      # 只有 fake-tiktok 注入 sidecar；middleware/observability 整体不注入
      # （见 infra/base/namespaces.yaml），没有 tlsMode 标签可选，不用列进来
      - fake-tiktok
  selector:
    matchLabels:
      # injection webhook 给所有注入 sidecar 的 Pod 打的标签，
      # 用它筛比用 app 标签可靠（不依赖业务命名）
      security.istio.io/tlsMode: istio
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      interval: 30s   # 网格指标用于排障/趋势，不需要 15s 粒度
      metricRelabelings:
        # 只保留排查服务间调用需要的指标：全量 Envoy stats 有几百条，
        # 绝大多数（cluster/listener 级）对这个项目无意义且吃存储
        - sourceLabels: [__name__]
          regex: 'istio_requests_total|istio_request_duration_milliseconds_bucket|istio_request_bytes_bucket|istio_response_bytes_bucket'
          action: keep
