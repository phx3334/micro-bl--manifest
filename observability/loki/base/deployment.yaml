# Loki 单片部署：Deployment + Service + 数据用 PVC
#
# 数据（chunks + index）全部在 PVC 上；目前用集群默认 StorageClass，
# 后续迁云盘时只需给 PVC 加 storageClassName 或换 default SC，配置文件不动。
# 单副本 + RWO → Recreate，避免滚动更新时新旧 Pod 抢同一块盘。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  labels:
    app.kubernetes.io/name: loki
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      # 单机 Loki，只读写本地 PVC，不访问 K8s API → 不挂载 SA token
      automountServiceAccountToken: false
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          args:
            - -config.file=/conf/loki.yaml
            # Loki 不会自动展开配置文件里的 ${VAR}，必须显式开这个开关
            # （loki.yaml 里的 ${LOKI_RETENTION:-168h} 依赖它）
            - -config.expand-env=true
          env:
            # 保留期：base 给默认值，overlays/*/patch-loki.yaml 按环境覆盖
            - name: LOKI_RETENTION
              value: 168h
          ports:
            - name: http
              containerPort: 3100
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: data
              mountPath: /var/loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
