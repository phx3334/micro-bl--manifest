apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 部署在 observability（监控组件的逻辑归属，与 Prometheus 同域）：
#   早期 Kafka 注入 sidecar（mTLS STRICT），网格外的 exporter 连 9092 会被拒，
#   所以曾迁入 middleware 跟它同注入。现在 middleware 整体不注入 sidecar
#   （见 infra/base/namespaces.yaml），连接安全由应用层单向 TLS 承担
#   （--tls.enabled + internal-ca，observability 命名空间已由 distributor 分发），
#   不再需要跟着网格划分走，迁回 observability。
#   ⚠️ 迁移时若集群里还有旧的 middleware 版本，需手动删干净再 apply：
#     kubectl -n middleware delete deploy,svc,servicemonitor kafka-exporter --ignore-not-found
namespace: observability

resources:
  - deployment.yaml
# 前置：集群已装 kube-prometheus-stack（ServiceMonitor CRD），否则 apply 会报 no matches for kind
